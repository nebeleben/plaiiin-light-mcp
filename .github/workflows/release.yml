# Runs on the PUBLIC repo (nebeleben/plaiiin-light-mcp). This file lives in public-repo-mcp/workflows/
# in the private mono-repo and is mirrored to .github/workflows/.
#
# Trigger: tag vX.Y.Z, which arrives together with the release commit on main (see ci.yml for what
# that commit holds). This workflow
#   1. rebuilds everything from the tagged source and fails if it differs from the published files,
#   2. publishes the npm/ folder of that very commit to npm as plaiiinlight-mcp@X.Y.Z,
#   3. lists that version in the official MCP Registry (npm/server.json),
#   4. creates the GitHub Release.
# So what `npx plaiiinlight-mcp` downloads is the tree this repository shows at the tag, and it is
# only published once the comparison passed.
#
# npm publishing uses TRUSTED PUBLISHING (OIDC): npm exchanges this job's GitHub Actions identity
# token for publish rights — no NPM_TOKEN secret exists anywhere, and npm attaches provenance that
# points at this repository and commit. Configured on npmjs.com -> plaiiinlight-mcp -> Settings ->
# Trusted Publisher (owner nebeleben, repository plaiiin-light-mcp, workflow release.yml).
# Requirements this file meets: a GitHub-hosted runner, `id-token: write`, Node >= 22.14 and
# npm >= 11.5.1 (hence the npm upgrade, to npm 11), NO `registry-url` on setup-node (that would write an
# .npmrc demanding a token), and npm/package.json's repository.url naming this repository.
#
# The 0.0.0* versions on npm are placeholders without code: npm only lets a trusted publisher be
# added to a package that already exists, so the name was created by hand once. Every other
# version comes from this workflow.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # OIDC token for npm trusted publishing + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        # A fixed major: this file is frozen into the release commit, and an npm major released
        # later must not be what decides whether this version can be published.
        run: npm install -g npm@11
      - run: npm ci
      - name: Published bundle matches the source
        run: |
          # A build from nothing: remove the committed outputs first, so a file the build no
          # longer writes shows up as deleted.
          rm -rf npm/dist npm/LICENSE npm/THIRD-PARTY-NOTICES.txt
          npm run build
          git diff --exit-code -- npm \
            || { echo "::error::the committed bundle differs from a fresh build of this source"; exit 1; }
          # ...and nothing the build writes may be missing from the commit (--ignored: the
          # outputs are git-ignored on the source branch, so plain status would not list them).
          EXTRA="$(git status --porcelain --ignored -- npm)"
          [ -z "$EXTRA" ] || { echo "::error::the build writes files that are not in the release: $EXTRA"; exit 1; }
      - name: Tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./npm/package.json').version")"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $TAG != npm/package.json $PKG"; exit 1; }
      - name: Publish to npm
        working-directory: npm
        run: |
          # A re-run after a later step failed must not trip over its own earlier success.
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$(npm view "plaiiinlight-mcp@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "plaiiinlight-mcp@$VERSION is already on npm — not publishing again"
          else
            npm publish --access public
          fi
      # ── MCP Registry (registry.modelcontextprotocol.io) ──────────────────────────────────────
      # The official registry lists this server as io.github.nebeleben/plaiiinlight-mcp, described
      # by npm/server.json. It proves ownership by finding that name ("mcpName") inside the npm
      # package, so it can only be told once npm actually serves this version — which takes a few
      # minutes after `npm publish` returns. Authentication is this job's GitHub identity (OIDC):
      # running in a repository of the user nebeleben is what grants the io.github.nebeleben/ names.
      - name: Wait until npm serves this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 90); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/plaiiinlight-mcp/-/plaiiinlight-mcp-$VERSION.tgz")" = "200" ]; then
              echo "npm serves plaiiinlight-mcp@$VERSION"; exit 0
            fi
            sleep 20
          done
          echo "::error::npm did not serve plaiiinlight-mcp@$VERSION within 30 minutes"; exit 1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.9
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$RUNNER_TEMP/$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$RUNNER_TEMP/$archive"
          tar xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" mcp-publisher
      - name: Publish to the MCP Registry
        working-directory: npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # A re-run after a later step failed must not trip over its own earlier success.
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.nebeleben%2Fplaiiinlight-mcp/versions/$VERSION")" = "200" ]; then
            echo "io.github.nebeleben/plaiiinlight-mcp $VERSION is already in the MCP Registry — not publishing again"
          else
            "$RUNNER_TEMP/mcp-publisher" login github-oidc
            "$RUNNER_TEMP/mcp-publisher" publish
          fi
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "plaiiinlight-mcp ${GITHUB_REF_NAME#v}" --notes-file - <<EOF
          In your AI program's MCP settings (a local, stdio server):

              npx -y plaiiinlight-mcp@${GITHUB_REF_NAME#v} --profile <name>

          Setup and examples: https://github.com/nebeleben/plaiiin-light-mcp#readme

          Published to npm with provenance from this tag: https://www.npmjs.com/package/plaiiinlight-mcp/v/${GITHUB_REF_NAME#v}
          Listed in the official MCP Registry as io.github.nebeleben/plaiiinlight-mcp.
          The bundle in this release was rebuilt from this tag's source by this workflow and found identical.
          EOF
